# ============================================================
#  Chuan hoa URL cho luongynguyenhuutoan.com  —  NGINX
#
#  Cach dung (aaPanel):
#    Website  ->  luongynguyenhuutoan.com  ->  Config (Cau hinh)
#    Dan 3 khoi duoi day vao trong block `server { ... }` dang phuc vu
#    port 443, roi bam Save va reload nginx.
#
#  Hoac neu quan ly nginx truc tiep:
#    cp nginx-redirect.conf /www/server/panel/vhost/nginx/
#    rồi them:  include /www/server/panel/vhost/nginx/nginx-redirect.conf;
#    vao trong server block, sau do:  nginx -t && nginx -s reload
# ============================================================

# 1. www -> non-www  (301 vinh vien)
if ($host = 'www.luongynguyenhuutoan.com') {
    return 301 https://luongynguyenhuutoan.com$request_uri;
}

# 2. /index.html -> /   va  /vithuoc/index.html -> /vithuoc/
rewrite ^(.*/)index\.html$ $1 permanent;

# 3. Trang loi 404 dung file 404.html san co
error_page 404 /404.html;
